<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee2b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Cricket: Play vs Bot</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center p-4 justify-between border-b border-primary/10">
<div class="flex size-10 items-center justify-center rounded-full bg-primary/10 text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">Play vs Bot</h2>
<div class="flex size-10 items-center justify-center">
<button class="flex items-center justify-center rounded-lg text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">info</span>
</button>
</div>
</header>
<!-- Top Section: Compact Status Bar -->
<div class="grid grid-cols-3 gap-3 p-4">
<div class="flex flex-col items-center justify-center gap-1 rounded-xl p-3 bg-primary/10 border border-primary/20">
<p class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Score</p>
<p class="text-xl font-bold leading-tight">74/3</p>
</div>
<div class="flex flex-col items-center justify-center gap-1 rounded-xl p-3 bg-primary/10 border border-primary/20">
<p class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Overs</p>
<p class="text-xl font-bold leading-tight">8.4/15</p>
</div>
<div class="flex flex-col items-center justify-center gap-1 rounded-xl p-3 bg-primary/10 border border-primary/20">
<p class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Target</p>
<p class="text-xl font-bold leading-tight">142</p>
</div>
</div>
<!-- Middle Section: Players & Result -->
<div class="flex-1 flex flex-col p-4 gap-6">
<!-- Avatars -->
<div class="flex items-center justify-between px-4">
<div class="flex flex-col items-center gap-2">
<div class="relative">
<div class="size-20 rounded-full border-4 border-primary bg-slate-200 overflow-hidden shadow-lg shadow-primary/20">
<img class="w-full h-full object-cover" data-alt="Professional cricket player profile portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBS3R9A5oXyUW9WWDegJgpKhvnQw22ND3JQbI31THDF9xsaUcXx1_Y7lbLNMWgePu_AbT6kEJpCJeWlROraIRU-TU2dittmXIEeQSA_SwOGPGRw7013XqMy4xacFoXxCzT9DmFjGGFcnKDhsKKgxVDAh9cwoaCq8bl_wklvTRmTfWlyorqFhVdSbX4_K3rkig4CS-kQ-PY7zhf75v-6uDN0UmyL4tLm3OvYnGc8ku9bbohTAuv5w4vHGxAnKVJj5sa8YlhAO4AXobtT"/>
</div>
<div class="absolute -bottom-1 -right-1 size-6 bg-primary rounded-full flex items-center justify-center border-2 border-background-light">
<span class="material-symbols-outlined text-[14px] text-slate-900 font-bold">person</span>
</div>
</div>
<p class="text-sm font-bold">You</p>
</div>
<div class="flex flex-col items-center">
<div class="px-4 py-1 rounded-full bg-slate-200 dark:bg-slate-800 text-[10px] font-black tracking-widest uppercase">VS</div>
<div class="h-px w-8 bg-slate-200 dark:bg-slate-800 my-2"></div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="relative">
<div class="size-20 rounded-full border-4 border-slate-300 dark:border-slate-700 bg-slate-200 overflow-hidden shadow-lg">
<img class="w-full h-full object-cover grayscale" data-alt="High-tech futuristic robot assistant head" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJMYvrT2UBgcrnBp075U_sxpPtciwtjHOXV5qDRgVVyW7Smpukh6oK9eZh0ODWTfHVrqhwsBbT8R27Kgp-FfxJ_U1cOF77U4t36sJ_HmG8wBOCBoyUIo8fkmUgzxJ2GzshtQP9JifZcqkhn3IYazbYlyHgDamVoNVNbITTbgzMEhQ-coOAPYmzJ2JmMlXwiCnrpAlq_XvDhxt9OHQbsGJnYiaSEj5C4lbdmt2cq8Kw0so9M_DFXdHaQJkbKwwm0pzFuNGdHU7uQtzN"/>
</div>
<div class="absolute -bottom-1 -left-1 size-6 bg-slate-400 rounded-full flex items-center justify-center border-2 border-background-light">
<span class="material-symbols-outlined text-[14px] text-white font-bold">smart_toy</span>
</div>
</div>
<p class="text-sm font-bold">Bot v2.0</p>
</div>
</div>
<!-- Large Action Result Display -->
<div class="flex-1 flex items-center justify-center">
<div class="w-full aspect-square max-h-[280px] rounded-3xl bg-white dark:bg-slate-900 border-2 border-dashed border-primary/30 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative Background Circle -->
<div class="absolute size-48 bg-primary/5 rounded-full blur-3xl"></div>
<div class="relative z-10 flex flex-col items-center gap-2">
<span class="text-slate-400 dark:text-slate-500 text-sm font-medium uppercase tracking-[0.2em]">Last Delivery</span>
<div class="size-32 rounded-full bg-primary flex items-center justify-center shadow-xl shadow-primary/30">
<span class="text-slate-900 text-6xl font-black italic tracking-tighter">4</span>
</div>
<p class="text-primary font-bold text-lg mt-2">BOUNDARY!</p>
</div>
</div>
</div>
</div>
<!-- Bottom Section: Thumb-friendly controls -->
<div class="p-6 bg-white dark:bg-slate-900 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t border-primary/10">
<div class="flex flex-col gap-4">
<div class="grid grid-cols-3 gap-4">
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold">1</span>
</button>
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold">2</span>
</button>
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold">3</span>
</button>
</div>
<div class="grid grid-cols-3 gap-4">
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold">4</span>
</button>
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold">5</span>
</button>
<button class="h-16 flex items-center justify-center rounded-2xl bg-background-light dark:bg-slate-800 border-2 border-transparent active:border-primary active:bg-primary/10 transition-all">
<span class="text-2xl font-bold text-primary">6</span>
</button>
</div>
</div>
</div>
<!-- Navigation Bar -->
<div class="flex gap-2 border-t border-primary/10 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2">
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-2 text-primary" href="#">
<span class="material-symbols-outlined fill-1">home</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-2 text-slate-400" href="#">
<span class="material-symbols-outlined">trophy</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-2 text-slate-400" href="#">
<span class="material-symbols-outlined">groups</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-2 text-slate-400" href="#">
<span class="material-symbols-outlined">settings</span>
</a>
</div>
</div>
</body></html>
