<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee2b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23102210' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Header Component -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 px-6 py-4 lg:px-40">
<div class="flex items-center gap-3">
<div class="text-primary">
<span class="material-symbols-outlined text-4xl">sports_cricket</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">Cricket Club</h2>
</div>
<div class="flex items-center gap-4">
<button class="flex size-10 items-center justify-center rounded-lg bg-primary/10 text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="size-10 rounded-full bg-primary/20 flex items-center justify-center overflow-hidden border border-primary/30">
<span class="material-symbols-outlined text-primary">person</span>
</div>
</div>
</header>
<main class="flex flex-1 justify-center py-8 lg:py-12 px-6">
<div class="layout-content-container flex flex-col max-w-[640px] flex-1">
<!-- Title Section -->
<div class="mb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-black leading-tight tracking-tight mb-2">Create Room</h1>
<p class="text-slate-600 dark:text-slate-400 text-lg">Set up your custom cricket match and invite players</p>
</div>
<!-- Form Section -->
<div class="bg-white dark:bg-background-dark/50 p-6 lg:p-8 rounded-xl border border-primary/10 shadow-sm space-y-6">
<!-- Room Name Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-base font-semibold">Room Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">label</span>
<input class="w-full pl-12 pr-4 py-4 rounded-lg border border-primary/20 bg-background-light dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100" placeholder="e.g. Weekend Warriors Trophy" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Number of Players Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-base font-semibold">Number of Players</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">groups</span>
<select class="custom-select w-full pl-12 pr-10 py-4 rounded-lg border border-primary/20 bg-background-light dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 appearance-none">
<option disabled="" selected="" value="">Select format</option>
<option value="2v2">2v2</option>
<option value="4v4">4v4</option>
<option value="6v6">6v6</option>
<option value="8v8">8v8</option>
<option value="11v11">11v11 (Standard)</option>
<option value="12v12">12v12</option>
</select>
</div>
</div>
<!-- Match Duration Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-base font-semibold">Match Duration</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">schedule</span>
<select class="custom-select w-full pl-12 pr-10 py-4 rounded-lg border border-primary/20 bg-background-light dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-slate-900 dark:text-slate-100 appearance-none">
<option disabled="" selected="" value="">Select duration</option>
<option value="1h">1 Hour</option>
<option value="2h">2 Hours</option>
<option value="3h">3 Hours</option>
<option value="4h">4 Hours</option>
<option value="full">Full Day</option>
</select>
</div>
</div>
</div>
<!-- Room Visibility Toggle (Added for modern UI feel) -->
<div class="flex items-center justify-between p-4 bg-primary/5 rounded-lg border border-primary/10">
<div class="flex flex-col">
<span class="font-semibold text-slate-900 dark:text-slate-100">Private Room</span>
<span class="text-xs text-slate-500">Only players with a link can join</span>
</div>
<div class="relative inline-flex h-6 w-11 items-center rounded-full bg-primary cursor-pointer">
<span class="inline-block h-4 w-4 translate-x-6 transform rounded-full bg-white transition"></span>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-slate-900 font-bold py-5 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined">add_circle</span>
<span class="text-lg">Create Room</span>
</button>
</div>
</div>
<!-- Decorative Graphic -->
<div class="mt-12 opacity-50 flex justify-center">
<div class="grid grid-cols-3 gap-8">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-primary">stadium</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Arena</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-primary">trophy</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Ranked</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-primary">diversity_3</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Social</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer component -->
<footer class="px-6 lg:px-40 py-8 border-t border-primary/10 text-center text-slate-400 text-sm">
<p>© 2024 Cricket Club Gaming. All rights reserved.</p>
</footer>
</div>
</div>
</body></html>
