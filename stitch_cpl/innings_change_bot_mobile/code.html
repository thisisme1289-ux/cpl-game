<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee2b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Innings Transition</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto border-x border-slate-200 dark:border-slate-800 shadow-sm">
<!-- Top Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12 uppercase">Innings Break</h2>
</div>
<main class="flex-1 flex flex-col px-4 pt-6 pb-8">
<!-- Header Section -->
<div class="text-center mb-8">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold leading-tight">First Innings Complete</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Player vs Bot Mode</p>
</div>
<!-- Scorecard Component -->
<div class="mb-6 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl overflow-hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
<div class="w-full bg-center bg-no-repeat aspect-video bg-cover relative" data-alt="Wide angle shot of a professional cricket stadium at dusk" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCETTaCNFX1dXHA55EFJ2BfZ-FnM6sMsyISGaaS8JQPhYXDu_uRpVLRkufT17GTnJQPYnKZcrEGsEOdRplOa7BxEJG3KMsAg-fhKRsZqgJxvuQZ7taBHtV72wwsbKaeiHXPcls8xFMEQOugHznsgebsAmVwbAHCQLuZmV9eGsBv98ZYbeM-ORy-zLdDMjfiELpqwl5sFCOwBiUeok7z4lkbgGzi2O3nxGiJOcBIo01RkKPsCbzYfotn_ix-WAVH6WMbMMUsDSsIFyMp");'>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<div class="absolute bottom-4 left-4">
<span class="bg-primary text-slate-900 text-[10px] font-bold px-2 py-1 rounded uppercase">Live Match Result</span>
</div>
</div>
<div class="flex w-full grow flex-col items-stretch justify-center gap-1 p-6">
<p class="text-slate-500 dark:text-slate-400 text-xs font-bold leading-normal uppercase tracking-widest">Bot's Final Score</p>
<div class="flex items-baseline gap-2">
<p class="text-slate-900 dark:text-slate-100 text-4xl font-bold leading-tight tracking-tight">185/4</p>
<p class="text-slate-500 dark:text-slate-400 text-lg font-medium leading-tight">(20.0)</p>
</div>
<div class="flex items-center gap-2 mt-2 pt-4 border-t border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-primary text-sm">info</span>
<p class="text-slate-600 dark:text-slate-300 text-sm font-medium">Bot played aggressive in the death overs</p>
</div>
</div>
</div>
</div>
<!-- Stats Grid -->
<div class="flex flex-wrap gap-4 mb-8">
<div class="flex min-w-[140px] flex-1 flex-col gap-2 rounded-xl p-6 bg-primary/10 border border-primary/20">
<p class="text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider">Target</p>
<p class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold">186</p>
<p class="text-slate-500 text-[10px] uppercase font-bold">To Win</p>
</div>
<div class="flex min-w-[140px] flex-1 flex-col gap-2 rounded-xl p-6 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
<p class="text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider">Req. Rate</p>
<p class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold">9.30</p>
<p class="text-slate-500 text-[10px] uppercase font-bold">Runs/Over</p>
</div>
</div>
<!-- Countdown Section -->
<div class="mt-auto py-8 flex flex-col items-center justify-center border-t border-slate-100 dark:border-slate-800">
<h4 class="text-slate-500 dark:text-slate-400 text-xs font-bold leading-normal tracking-widest uppercase mb-4">Second Innings Starts In</h4>
<div class="relative flex items-center justify-center">
<!-- Progress Ring -->
<svg class="w-24 h-24 transform -rotate-90">
<circle class="text-slate-200 dark:text-slate-800" cx="48" cy="48" fill="transparent" r="42" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary" cx="48" cy="48" fill="transparent" r="42" stroke="currentColor" stroke-dasharray="264" stroke-dashoffset="66" stroke-width="6"></circle>
</svg>
<span class="absolute text-3xl font-bold text-slate-900 dark:text-slate-100">30</span>
</div>
<div class="mt-8 w-full flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-slate-900 font-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined">play_arrow</span>
                        START CHASE NOW
                    </button>
<button class="w-full bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 font-semibold py-3 rounded-xl transition-colors text-sm uppercase tracking-wider">
                        Full Scorecard
                    </button>
</div>
</div>
</main>
<!-- Navigation Placeholder -->
<div class="h-4 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
