<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee2b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Logout Confirmation</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<!-- Blurred Dashboard Background Simulation -->
<div class="fixed inset-0 z-0 flex flex-col blur-sm grayscale-[0.2] opacity-50 pointer-events-none">
<!-- Navigation Simulation -->
<header class="h-16 border-b border-primary/20 bg-white/80 px-8 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-lg"></div>
<div class="h-4 w-32 bg-slate-200 rounded"></div>
</div>
<div class="flex gap-4">
<div class="h-8 w-8 bg-slate-200 rounded-full"></div>
<div class="h-8 w-8 bg-slate-200 rounded-full"></div>
</div>
</header>
<!-- Dashboard Content Simulation -->
<main class="p-8 flex-1 grid grid-cols-12 gap-6">
<aside class="col-span-3 space-y-4">
<div class="h-10 bg-slate-200 rounded-lg w-full"></div>
<div class="h-10 bg-primary/20 rounded-lg w-full"></div>
<div class="h-10 bg-slate-200 rounded-lg w-full"></div>
<div class="h-10 bg-slate-200 rounded-lg w-full"></div>
</aside>
<section class="col-span-9 space-y-6">
<div class="grid grid-cols-3 gap-4">
<div class="h-32 bg-white border border-primary/10 rounded-xl"></div>
<div class="h-32 bg-white border border-primary/10 rounded-xl"></div>
<div class="h-32 bg-white border border-primary/10 rounded-xl"></div>
</div>
<div class="h-64 bg-white border border-primary/10 rounded-xl w-full"></div>
<div class="h-48 bg-white border border-primary/10 rounded-xl w-full"></div>
</section>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md">
<!-- Modal Container -->
<div class="relative w-full max-w-[480px] bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden m-4 border border-primary/20">
<!-- Modal Content -->
<div class="layout-container flex flex-col h-auto">
<div class="px-6 py-10 flex flex-col items-center">
<!-- Icon Section -->
<div class="mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined !text-4xl">logout</span>
</div>
<!-- Header and Description -->
<div class="text-center mb-8">
<h4 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight mb-2">
                            Are you sure you want to logout?
                        </h4>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal px-4">
                            You will need to enter your credentials to access your account again.
                        </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 w-full px-4">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-slate-900 text-lg font-bold transition-all hover:brightness-110 active:scale-[0.98]">
<span class="truncate">Confirm Logout</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary/10 text-slate-900 dark:text-slate-100 text-lg font-bold transition-all hover:bg-primary/20 active:scale-[0.98]">
<span class="truncate">Cancel</span>
</button>
</div>
</div>
</div>
<!-- Subtle Decorative Bottom Bar -->
<div class="h-1.5 w-full bg-gradient-to-r from-primary/20 via-primary to-primary/20"></div>
</div>
</div>
</body></html>
